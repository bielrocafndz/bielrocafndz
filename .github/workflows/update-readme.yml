name: Actualizar README

on:
  schedule:
    - cron: "0 6 * * *" # cada día a las 6:00 UTC
  workflow_dispatch: # botón para lanzarlo a mano
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Recharts
        run: npm install --no-save react@18 react-dom@18 recharts@2.15

      - name: Generar gráficos y proyectos
        run: node scripts/generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Generar serpiente de contribuciones
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            charts/snake.svg
            charts/snake-dark.svg?palette=github-dark

      - name: Commit de los cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md charts
          git diff --staged --quiet || (git commit -m "🤖 Actualizar README y gráficos" && git push)
